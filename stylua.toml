# Formatting contract for lua/ and tests/, enforced by the Code Quality CI job.
# These match the values the tree was already formatted with; declaring them
# explicitly keeps a stylua release that changes a default from silently
# reformatting the whole codebase.
column_width = 120
line_endings = "Unix"
indent_type = "Tabs"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
